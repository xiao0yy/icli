name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build signed executable
        run: ./scripts/build.sh
      - name: Check command contract
        run: python3 scripts/smoke.py dist/icli
      - name: Verify release tag and architecture
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          test "$(lipo -archs dist/icli)" = "$EXPECTED_ARCH"
          if [ "$IS_TAG" = true ]; then
            test "$RELEASE_TAG" = "v$(dist/icli --version)"
          fi
      - name: Package
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: icli-macos-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: icli-macos-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          for checksum in *.sha256; do shasum -a 256 -c "$checksum"; done
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" *.tar.gz *.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" *.tar.gz *.sha256 --verify-tag --generate-notes
          fi
